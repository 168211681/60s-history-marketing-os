name: Validate staging database

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-db-validation
  cancel-in-progress: false

jobs:
  validate-staging:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, history-ci]
    timeout-minutes: 20
    env:
      STAGING_PROJECT_REF: haqpqifxlqpihkmhkwdu
      PRODUCTION_PROJECT_REF: rscwajzsjvguezyisvja
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify staging credentials and target identity
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${STAGING_DATABASE_URL:-}" || {
            echo "Missing SUPABASE_STAGING_DATABASE_URL repository secret." >&2
            exit 64
          }
          test "$STAGING_PROJECT_REF" = "haqpqifxlqpihkmhkwdu"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          node <<'NODE'
          const url = new URL(process.env.STAGING_DATABASE_URL);
          const stagingRef = process.env.STAGING_PROJECT_REF;
          const productionRef = process.env.PRODUCTION_PROJECT_REF;
          const expectedHost = `db.${stagingRef}.supabase.co`;
          if (url.protocol !== "postgres:" && url.protocol !== "postgresql:") {
            throw new Error("STAGING_DATABASE_URL must use PostgreSQL.");
          }
          if (url.hostname === productionRef || url.hostname.includes(productionRef)) {
            throw new Error("Production project reference found in staging database target.");
          }
          if (url.hostname !== expectedHost) {
            throw new Error("Staging database host is not the independently verified direct host.");
          }
          if (url.pathname !== "/postgres") {
            throw new Error("Staging database target must be the postgres database.");
          }
          console.log("Staging database target identity passed without printing credentials.");
          NODE

      - name: Install pinned Supabase CLI
        run: npx --yes supabase@2.117.0 --version

      - name: Verify Supabase project access and ref
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "Missing SUPABASE_STAGING_ACCESS_TOKEN repository secret." >&2
            exit 64
          }
          npx --yes supabase@2.117.0 projects list --output-format json > "$RUNNER_TEMP/staging-projects.json"
          node "$GITHUB_WORKSPACE/scripts/ci/assert-staging-project.mjs" "$RUNNER_TEMP/staging-projects.json" "$STAGING_PROJECT_REF"

      - name: Compare local migrations with staging
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 migration list \
            --db-url "$STAGING_DATABASE_URL" \
            --project-ref "$STAGING_PROJECT_REF" \
            --output-format json > "$RUNNER_TEMP/staging-migrations.json"
          node "$GITHUB_WORKSPACE/scripts/ci/assert-staging-migrations.mjs" \
            "$RUNNER_TEMP/staging-migrations.json" \
            "$GITHUB_WORKSPACE/supabase/migrations"

      - name: Install dependencies
        run: npm ci

      - name: Run local database verification suite
        run: npm run test:db

      - name: Run read-only retirement verification against staging
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql --dbname="$STAGING_DATABASE_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file=scripts/db/verify-retirement.sql
