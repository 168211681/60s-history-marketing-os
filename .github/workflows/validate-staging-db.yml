name: Validate staging database

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-db-validation
  cancel-in-progress: false

jobs:
  validate-staging:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, history-ci]
    timeout-minutes: 20
    env:
      STAGING_PROJECT_REF: haqpqifxlqpihkmhkwdu
      PRODUCTION_PROJECT_REF: rscwajzsjvguezyisvja
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify staging credentials and target identity
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${STAGING_DATABASE_URL:-}" || {
            echo "Missing SUPABASE_STAGING_DATABASE_URL repository secret." >&2
            exit 64
          }
          test "$STAGING_PROJECT_REF" = "haqpqifxlqpihkmhkwdu"
          test "$STAGING_PROJECT_REF" != "$PRODUCTION_PROJECT_REF"
          node "$GITHUB_WORKSPACE/scripts/ci/assert-staging-database-url.mjs" \
            "$STAGING_DATABASE_URL" "$STAGING_PROJECT_REF" "$PRODUCTION_PROJECT_REF"

      - name: Install pinned Supabase CLI
        run: npx --yes supabase@2.117.0 --version

      - name: Verify Supabase project access and ref
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "Missing SUPABASE_STAGING_ACCESS_TOKEN repository secret." >&2
            exit 64
          }
          npx --yes supabase@2.117.0 projects list --output-format json > "$RUNNER_TEMP/staging-projects.json"
          node "$GITHUB_WORKSPACE/scripts/ci/assert-staging-project.mjs" "$RUNNER_TEMP/staging-projects.json" "$STAGING_PROJECT_REF"

      - name: Prove read-only PostgreSQL connectivity
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          run_read_only_query() {
            local label="$1"
            local query="$2"
            local output_file="$RUNNER_TEMP/${label}.out"
            local error_file="$RUNNER_TEMP/${label}.err"
            if ! psql "$STAGING_DATABASE_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --command="$query" >"$output_file" 2>"$error_file"; then
              node "$GITHUB_WORKSPACE/scripts/ci/sanitize-cli-diagnostic.mjs" \
                "$error_file" "$STAGING_DATABASE_URL"
              exit 1
            fi
            cat "$output_file"
          }
          run_read_only_query identity 'select current_database(), current_user;'
          run_read_only_query migration-access 'select count(*) from supabase_migrations.schema_migrations;'

      - name: Compare local migrations with staging
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$STAGING_DATABASE_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --tuples-only \
            --no-align \
            --quiet \
            --command='select version from supabase_migrations.schema_migrations order by version;' \
            > "$RUNNER_TEMP/staging-migration-versions.txt"
          node "$GITHUB_WORKSPACE/scripts/ci/assert-staging-migration-versions.mjs" \
            "$RUNNER_TEMP/staging-migration-versions.txt" \
            "$GITHUB_WORKSPACE/supabase/migrations"

      - name: Install dependencies
        run: npm ci

      - name: Run local database verification suite
        run: npm run test:db

      - name: Run read-only retirement verification against staging
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql --dbname="$STAGING_DATABASE_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file=scripts/db/verify-retirement.sql
