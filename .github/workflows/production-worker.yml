name: Production workflow worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: production-workflow
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process one queued workflow
        env:
          WORKER_URL: ${{ secrets.PRODUCTION_WORKER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$WORKER_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$WORKER_URL/api/cron/production-workflow"
