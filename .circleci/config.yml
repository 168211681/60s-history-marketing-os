version: 2.1

# Alternative to GitHub Actions billing-locked CI.
# This workflow tests only repository code and disposable local resources.
# It must NEVER receive Staging/Production environment credentials.
jobs:
  verify-isolated:
    docker:
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    resource_class: medium
    working_directory: /home/pwuser/clipforge
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run:
          name: Forbid hosted database and privileged credentials
          command: |
            set -euo pipefail
            for key in DATABASE_URL STAGING_DATABASE_URL SUPABASE_STAGING_DATABASE_URL SUPABASE_ACCESS_TOKEN SUPABASE_STAGING_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY; do
              if printenv "$key" >/dev/null 2>&1; then
                echo "Refusing external credential variable: $key"
                exit 64
              fi
            done
      - run:
          name: Install pinned npm dependencies
          command: npm ci
      - run:
          name: Unit tests, lint, types, production build
          command: |
            set -euo pipefail
            npm test
            npm run lint
            npm run typecheck
            npm run build -- --webpack
      - run:
          name: Install PostgreSQL 16 binaries for disposable local DB
          command: |
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-16
            pg_config --version
      - run:
          name: Local PostgreSQL integration tests (no hosted DB)
          command: |
            set -euo pipefail
            test -d /home/pwuser/clipforge
            runuser -u pwuser -- env HOME=/home/pwuser npm run test:db
      - run:
          name: Playwright desktop and iPhone browser suites
          command: npm run test:e2e
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  clipforge-review:
    jobs:
      - verify-isolated
